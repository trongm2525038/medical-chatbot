<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot y tế</title>
    <style>
        /* CSS đơn giản cho hộp chat */
        body { font-family: Arial, sans-serif; }
        #chat-box { 
            width: 400px; height: 500px; border: 1px solid #ccc; 
            overflow-y: scroll; padding: 10px; margin: 20px auto; 
            border-radius: 8px; background-color: #f9f9f9;
        }
        .message { margin: 5px 0; padding: 8px; border-radius: 5px; }
        .user { background-color: #d1e7ff; text-align: right; }
        .bot { background-color: #e2e3e5; text-align: left; }
        #user-input { width: calc(100% - 70px); padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        #send-button { width: 60px; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-box">
        <div class="message bot">Chào bạn! Tôi là Chatbot hỗ trợ y tế. Bạn cần hỏi gì ạ?</div>
    </div>
    <div style="width: 400px; margin: 0 auto; display: flex;">
        <input type="text" id="user-input" placeholder="Nhập câu hỏi của bạn...">
        <button id="send-button" onclick="sendMessage()">Gửi</button>
    </div>

    <script>
        function appendMessage(sender, message) {
            const chatBox = document.getElementById('chat-box');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = message;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Cuộn xuống dưới
        }

        function sendMessage() {
            const inputElement = document.getElementById('user-input');
            const message = inputElement.value.trim();
            
            if (message === "") return;

            // 1. Hiển thị tin nhắn người dùng
            appendMessage('user', message);
            inputElement.value = ''; // Xóa input

            // 2. Gọi API Flask
            fetch('/get_response', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: message }),
            })
            .then(response => response.json())
            .then(data => {
                // 3. Hiển thị phản hồi của Bot
                appendMessage('bot', data.response);
            })
            .catch(error => {
                console.error('Lỗi khi gửi yêu cầu:', error);
                appendMessage('bot', 'Xin lỗi, đã xảy ra lỗi kết nối với máy chủ.');
            });
        }
        
        // Thêm tính năng gửi tin nhắn bằng phím Enter
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
